name: Build Branches

on:
  push:
    branches-ignore:
      - main

jobs:
  build_and_test:
    name: "Build and Test"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'
          
    - name: Build uber-jar and run tests (incl. Playwright e2e)
      run: ./mvnw verify -Dquarkus.package.jar.type=uber-jar

    - name: Archive jars
      uses: actions/upload-artifact@v7
      with:
        name: jars
        path: target/international-*-SNAPSHOT-runner.jar

    - name: Archive Playwright traces (on failure)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces
        path: target/playwright-traces/
        if-no-files-found: ignore
