{#include base}

<h2>Volontariat löschen</h2>

<p><a href="/volontariat">zurück zur Übersicht</a></p>

{#voluntaryService service showActions=false}{/voluntaryService}

<p>Möchten sie obenstehendes Volontariat wirklich löschen?</p>

<a href="/volontariat">Nein</a>
<form action="/volontariat/delete" method="post" class="inline-form">
    <input type="hidden" name="{inject:csrf.parameterName}" value="{inject:csrf.token}"/>
    <input type="hidden" name="id" value="{id}"/>
    <button type="submit" class="margin-left">Ja</button>
</form>

{/include}
