<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>International</title>
  <link rel="stylesheet" href="/css/site.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Pages that need more than the site stylesheet fill this in. The rich-text editor is the
       only user today: it is loaded by the two administrator form pages and by nothing else, so a
       visitor never downloads it (NFR-036). -->
  {#insert head}{/}
</head>
<body>
  <header>
    <input class="side-menu" type="checkbox" id="side-menu"/>
    <label class="hamb" for="side-menu"><span class="hamb-line"></span></label>
    <a href="/"><img src="/logo.png" height="50px" class="logo" /></a>
    <nav>
      <ul>
        <li><a href="/anlaesse" {#if inject:vertxRequest.uri.startsWith("/anlaesse")}class="active"{/if}>Anlässe</a></li>
        <li><a href="/volontariat" {#if inject:vertxRequest.uri.startsWith("/volontariat")}class="active"{/if}>Volontariat</a></li>
        <li><a href="/fgi" {#if inject:vertxRequest.uri.startsWith("/fgi")}class="active"{/if}>FGI</a></li>
        <li><a href="/datenschutzinformation" {#if inject:vertxRequest.uri.startsWith("/datenschutzinformation")}class="active"{/if}>Datenschutzinformation</a></li>
        <li><a href="/kontakt" {#if inject:vertxRequest.uri.startsWith("/kontakt")}class="active"{/if}>Kontakt</a></li>
        {#if inject:currentUser.signedIn}
        <li>
          <form action="/auth/logout" method="post" class="nav-form">
            <input type="hidden" name="{inject:csrf.parameterName}" value="{inject:csrf.token}"/>
            <button type="submit">Ausloggen</button>
          </form>
        </li>
        {/if}
      </ul>
    </nav>
  </header>
  <main>
      {#insert}Kein Inhalt{/}
  </main>
  <footer>
    Unterstützt durch <a href="https://www.hosttech.ch/webhosting/cevihost/">Hosttech (Cevihost)</a>
  </footer>
  {#insert scripts}{/}
</body>
</html>
