quarkus.mailer.mock=false

# TLS is terminated by the reverse proxy, so the application only ever sees plain HTTP. Trusting
# the X-Forwarded-* headers is what makes Quarkus mark the session and CSRF cookies "Secure" and
# what makes redirects keep the https scheme. Safe here because the container is reachable through
# the proxy network only - never expose the port directly with this enabled.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
