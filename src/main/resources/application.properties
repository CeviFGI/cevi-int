#
# Application
#
application.contactform.to=ignore@localhost

#
# Database
#
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:/tmp/international.db?journal_mode=wal
quarkus.datasource.jdbc.min-size=1
quarkus.hibernate-orm.database.generation = validate
quarkus.flyway.migrate-at-start=true

#
# Authentication
#
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/auth/login
quarkus.http.auth.form.error-page=/auth/error
quarkus.http.auth.form.landing-page=/
quarkus.http.auth.form.http-only-cookie=true
# Strict also covers top-level navigation, so the credential cookie is never sent along with a
# request that another site started - not even a plain link.
quarkus.http.auth.form.cookie-same-site=strict
# A session left unused expires; the cookie is stateless and cannot be withdrawn server-side.
quarkus.http.auth.form.timeout=PT30M
quarkus.http.auth.form.new-cookie-interval=PT1M
# Emit AuthenticationFailureEvent/FormAuthenticationEvent so sign-in attempts can be logged.
quarkus.security.events.enabled=true

# The session encryption key is a production secret and is therefore NOT configured here.
# It is supplied per environment (QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY, see docs/deployment.md);
# ProductionSecurityCheck aborts the start if it is missing under the prod profile.
# The value below is a throw-away for local development and testing only.
%dev.quarkus.http.auth.session.encryption-key=DEV-ONLY-DO-NOT-USE-IN-PRODUCTION-0000000=
%test.quarkus.http.auth.session.encryption-key=TEST-ONLY-DO-NOT-USE-IN-PRODUCTION-000000=

#
# Initial administrator account
#
# Created on startup when the user table is empty. In production the password comes from a secret
# (APPLICATION_ADMIN_PASSWORD); without it the application refuses to start. See docs/deployment.md.
application.admin.username=admin
%dev.application.admin.password=admin
%test.application.admin.password=admin

#
# CSRF protection
#
quarkus.rest-csrf.cookie-http-only=true
quarkus.rest-csrf.cookie-same-site=strict

#
# HTTP security headers
#
# Summernote and the templates rely on inline styles, so style-src needs 'unsafe-inline';
# script-src must never get it, because it is the second line of defence behind the HTML
# sanitiser. Event descriptions may embed pictures inline or link them from other sites.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'
quarkus.http.header."Content-Security-Policy".path=/*
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Frame-Options".path=/*
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Content-Type-Options".path=/*
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Referrer-Policy".path=/*
quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=(), camera=(), interest-cohort=()
quarkus.http.header."Permissions-Policy".path=/*
# Browsers ignore HSTS on plain HTTP, so this is inert in dev and effective behind the TLS proxy.
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."Strict-Transport-Security".path=/*

#
# Request limits
#
# A description may hold up to 65535 characters and the editor embeds pasted pictures inline, so a
# single form attribute has to be allowed to grow well beyond the 2 KB default. The body limit is
# the backstop for the anonymous contact form: without it a single request may write megabytes into
# the database file, which shares a filesystem with the host.
quarkus.http.limits.max-form-attribute-size=256K
quarkus.http.limits.max-body-size=1M

#
# Localization/Internationalization
#
quarkus.default-locale=de-CH
quarkus.locales=de-CH

#
# Various
#
quarkus.log.level=INFO
quarkus.mailer.mock=true
quarkus.http.enable-compression=true

#
# Caching
#
quarkus.http.static-resources.caching-enabled=false

#
# Debugging
#
# log database queries
#quarkus.log.category."org.hibernate".level=DEBUG

# log mail interaction
#quarkus.log.category."io.vertx.ext.mail".level=DEBUG